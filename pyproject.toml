[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexter"
version = "0.1.0"
description = "A minimal, bandwidth-first inference engine for World Action Models on AMD RDNA3.5"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "rich"]

[project.scripts]
dexter-bench = "dexter.bench.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 100
